<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <defs>
    <radialGradient id="bubuBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E99" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="duduBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8E85" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartPinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FF5277"/>
    </linearGradient>
    <linearGradient id="heartRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#D92027"/>
    </linearGradient>
    <linearGradient id="bobaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D1A0"/>
      <stop offset="100%" stop-color="#C59B6D"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2F1FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#362213" flood-opacity="0.12"/>
    </filter>
  </defs>

<g filter="url(#softShadow)">

      
    <!-- Feet with dark bottom curves -->
    <ellipse cx="208" cy="425" rx="28" ry="20" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.5"/>
    <ellipse cx="304" cy="425" rx="28" ry="20" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.5"/>
    <!-- Chubby Pure White Body -->
    <ellipse cx="256" cy="350" rx="105" ry="88" fill="#FFFFFF" stroke="#2B2421" stroke-width="8"/>
  
      
    <!-- Bubu Ears (Solid Round Panda Ears) -->
    <circle cx="160" cy="130" r="38" fill="#2B2421" stroke="#2B2421" stroke-width="4"/>
    <circle cx="352" cy="130" r="38" fill="#2B2421" stroke="#2B2421" stroke-width="4"/>
    <!-- Bubu Head Contour (Chubby Cute Face) -->
    <path d="M 146 205
             C 126 150, 181 105, 256 105
             C 331 105, 386 150, 366 205
             C 386 260, 351 300, 256 300
             C 161 300, 126 260, 146 205 Z"
          fill="#FFFFFF" stroke="#2B2421" stroke-width="8" stroke-linejoin="round"/>
    <!-- Blushing Pink Cheeks -->
    <ellipse cx="180" cy="227" rx="28" ry="18" fill="#FFA8A3" opacity="0.85"/>
    <ellipse cx="332" cy="227" rx="28" ry="18" fill="#FFA8A3" opacity="0.85"/>
  
      
    <!-- Left Eye Solid Dot -->
    <circle cx="204" cy="201" r="13" fill="#2B2421"/>
    <!-- Right Eye Playful Wink Curve -->
    <path d="M 294 201 Q 308 187 322 201"
          fill="none" stroke="#2B2421" stroke-width="7" stroke-linecap="round"/>
    <!-- Playful Mouth -->
    <path d="M 242 219 Q 256 233 270 219"
          fill="#FF758C" stroke="#2B2421" stroke-width="5" stroke-linecap="round"/>
    <!-- Bubu Neck Bowtie Ribbon -->
    <path d="M 256 297 L 232 287 L 236 309 Z M 256 297 L 280 287 L 276 309 Z" fill="#2B2421"/>
    <circle cx="256" cy="298" r="6" fill="#2B2421"/>
  
      <!-- Left Paw on Cheek -->
      <ellipse cx="170" cy="265" rx="20" ry="16" fill="#FFFFFF" stroke="#2B2421" stroke-width="7"/>
      <!-- Right Paw Blowing Kiss -->
      <ellipse cx="320" cy="245" rx="20" ry="16" fill="#FFFFFF" stroke="#2B2421" stroke-width="7"/>
      <!-- Floating Heart Kisses Trail -->
      <path d="M 335 220 Q 365 200 375 160 Q 380 120 420 100" fill="none" stroke="#FFA8A3" stroke-width="4" stroke-dasharray="6,6" stroke-linecap="round"/>
      <g transform="translate(370, 130) scale(0.65)">
        <path d="M 40 40 C 40 20, 10 0, 10 30 C 10 55, 40 85, 40 90 C 40 85, 70 55, 70 30 C 70 0, 40 20, 40 40 Z" fill="#FF5277" stroke="#2B2421" stroke-width="6"/>
      </g>
      <g transform="translate(415, 65) scale(0.95)">
        <path d="M 40 40 C 40 20, 10 0, 10 30 C 10 55, 40 85, 40 90 C 40 85, 70 55, 70 30 C 70 0, 40 20, 40 40 Z" fill="#FF5277" stroke="#2B2421" stroke-width="6"/>
      </g>
    
</g>
</svg>