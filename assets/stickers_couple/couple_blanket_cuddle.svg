<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <defs>
    <radialGradient id="bubuBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E99" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="duduBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8E85" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartPinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FF5277"/>
    </linearGradient>
    <linearGradient id="heartRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#D92027"/>
    </linearGradient>
    <linearGradient id="bobaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D1A0"/>
      <stop offset="100%" stop-color="#C59B6D"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2F1FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#362213" flood-opacity="0.12"/>
    </filter>
  </defs>

<g filter="url(#softShadow)">

      <!-- Night Sky Backdrop Pill -->
      <rect x="70" y="80" width="372" height="360" rx="40" fill="#2D3436" stroke="#3E2723" stroke-width="7"/>
      <!-- Moon & Stars inside window -->
      <circle cx="370" cy="140" r="28" fill="#FEEAA7"/>
      <circle cx="380" cy="135" r="24" fill="#2D3436"/>
      <circle cx="130" cy="140" r="4" fill="#FFF"/>
      <circle cx="180" cy="115" r="3" fill="#FFF"/>
      <circle cx="280" cy="120" r="3" fill="#FFF"/>
      <!-- Heads Side by Side -->
      
    <!-- Bubu Ears -->
    <circle cx="116.7" cy="176.25" r="32.3" fill="#2B2421" stroke="#2B2421" stroke-width="3.4"/>
    <circle cx="283.3" cy="176.25" r="32.3" fill="#2B2421" stroke="#2B2421" stroke-width="3.4"/>
    <!-- Bubu Head Contour -->
    <path d="M 106.5 240
             C 89.5 193.25, 136.25 155, 200 155
             C 263.75 155, 310.5 193.25, 293.5 240
             C 310.5 286.75, 280.75 320.75, 200 320.75
             C 119.25 320.75, 89.5 286.75, 106.5 240 Z"
          fill="#FFFFFF" stroke="#2B2421" stroke-width="6.8" stroke-linejoin="round"/>
    <!-- Blushing Cheeks -->
    <ellipse cx="135.4" cy="261.25" rx="25.5" ry="15.299999999999999" fill="url(#bubuBlush)"/>
    <ellipse cx="264.6" cy="261.25" rx="25.5" ry="15.299999999999999" fill="url(#bubuBlush)"/>
  
      
    <!-- Left Happy Eye Curve -->
    <path d="M 138.8 233.2 Q 152.4 219.6 166 233.2"
          fill="none" stroke="#2B2421" stroke-width="6.375" stroke-linecap="round"/>
    <!-- Right Happy Eye Curve -->
    <path d="M 234 233.2 Q 247.6 219.6 261.2 233.2"
          fill="none" stroke="#2B2421" stroke-width="6.375" stroke-linecap="round"/>
    <!-- Nose & Sweet Smile -->
    <ellipse cx="200" cy="244.25" rx="5.1" ry="3.4" fill="#2B2421"/>
    <path d="M 190.65 251.05 C 194.9 257.85, 200 257.85, 200 251.05 C 200 257.85, 205.1 257.85, 209.35 251.05"
          fill="none" stroke="#2B2421" stroke-width="4.675" stroke-linecap="round"/>
  
      
    <!-- Dudu Ears -->
    <circle cx="228.7" cy="176.25" r="32.3" fill="#BA8358" stroke="#3E2723" stroke-width="6.375"/>
    <circle cx="228.7" cy="176.25" r="18.7" fill="#8C5935"/>
    <circle cx="395.3" cy="176.25" r="32.3" fill="#BA8358" stroke="#3E2723" stroke-width="6.375"/>
    <circle cx="395.3" cy="176.25" r="18.7" fill="#8C5935"/>
    <!-- Dudu Head Contour -->
    <path d="M 218.5 240
             C 201.5 193.25, 248.25 155, 312 155
             C 375.75 155, 422.5 193.25, 405.5 240
             C 422.5 286.75, 392.75 320.75, 312 320.75
             C 231.25 320.75, 201.5 286.75, 218.5 240 Z"
          fill="#BA8358" stroke="#3E2723" stroke-width="6.8" stroke-linejoin="round"/>
    <!-- Snout Muzzle -->
    <ellipse cx="312" cy="258.7" rx="42.5" ry="30.599999999999998" fill="#F5E3D0" stroke="#3E2723" stroke-width="4.25"/>
    <!-- Blushing Cheeks -->
    <ellipse cx="245.7" cy="258.7" rx="23.8" ry="13.6" fill="url(#duduBlush)"/>
    <ellipse cx="378.3" cy="258.7" rx="23.8" ry="13.6" fill="url(#duduBlush)"/>
  
      
    <!-- Left Happy Eye Curve -->
    <path d="M 250.8 229.8 Q 264.4 216.2 278 229.8"
          fill="none" stroke="#3E2723" stroke-width="6.375" stroke-linecap="round"/>
    <!-- Right Happy Eye Curve -->
    <path d="M 346 229.8 Q 359.6 216.2 373.2 229.8"
          fill="none" stroke="#3E2723" stroke-width="6.375" stroke-linecap="round"/>
    <!-- Nose & Open Mouth with Tongue -->
    <path d="M 302.65 247.65 Q 312 242.55 321.35 247.65 Q 312 257.85 302.65 247.65 Z"
          fill="#3E2723"/>
    <path d="M 301.8 262.1 Q 312 275.7 322.2 262.1 Z"
          fill="#FF758C" stroke="#3E2723" stroke-width="3.8249999999999997"/>
  
      <!-- Warm Quilt Covering Bodies -->
      <path d="M 100 290 C 210 260, 310 260, 412 290 L 412 430 L 100 430 Z" fill="#E17055" stroke="#3E2723" stroke-width="7"/>
      <!-- Quilt Pattern -->
      <line x1="100" y1="360" x2="412" y2="360" stroke="#FAB1A0" stroke-width="5"/>
      <line x1="256" y1="290" x2="256" y2="430" stroke="#FAB1A0" stroke-width="5"/>
      <!-- Steaming Hot Cocoa Mug -->
      <g transform="translate(256, 340)">
        <rect x="-18" y="0" width="36" height="35" rx="6" fill="#F8EFBA" stroke="#3E2723" stroke-width="4.5"/>
        <path d="M -4 -8 Q 0 -18 -4 -25" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
        <path d="M 4 -8 Q 8 -18 4 -25" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
      </g>
    
</g>
</svg>