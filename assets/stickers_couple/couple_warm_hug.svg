          fill="#BA8358" stroke="#3E2723" stroke-width="7.6" stroke-linejoin="round"/>
    <!-- Snout Muzzle -->
    <ellipse cx="315" cy="225.9" rx="47.5" ry="34.199999999999996" fill="#F5E3D0" stroke="#3E2723" stroke-width="4.75"/>
    <!-- Blushing Cheeks -->
    <ellipse cx="240.9" cy="225.9" rx="26.599999999999998" ry="15.2" fill="url(#duduBlush)"/>
    <ellipse cx="389.1" cy="225.9" rx="26.599999999999998" ry="15.2" fill="url(#duduBlush)"/>
  
      
    <!-- Left Happy Eye Curve -->
    <path d="M 246.60000000000002 193.6 Q 261.8 178.4 277 193.6"
          fill="none" stroke="#3E2723" stroke-width="7.125" stroke-linecap="round"/>
    <!-- Right Happy Eye Curve -->
    <path d="M 353 193.6 Q 368.2 178.4 383.4 193.6"
          fill="none" stroke="#3E2723" stroke-width="7.125" stroke-linecap="round"/>
    <!-- Nose & Open Mouth with Tongue -->
    <path d="M 304.55 213.55 Q 315 207.85 325.45 213.55 Q 315 224.95 304.55 213.55 Z"
          fill="#3E2723"/>
    <path d="M 303.6 229.7 Q 315 244.9 326.4 229.7 Z"
          fill="#FF758C" stroke="#3E2723" stroke-width="4.2749999999999995"/>
  
      <!-- Bubu Body & Head (Left) Leaning In -->
      <g transform="translate(-10, 10)">
        
    <!-- Feet -->
    <ellipse cx="149.4" cy="409.75" rx="26.599999999999998" ry="19" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.125"/>
    <ellipse cx="240.6" cy="409.75" rx="26.599999999999998" ry="19" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.125"/>
    <!-- Chubby White Body -->
    <ellipse cx="195" cy="338.5" rx="99.75" ry="83.6" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.6"/>
  
        
    <!-- Bubu Ears -->
    <circle cx="101.9" cy="133.75" r="36.1" fill="#2B2421" stroke="#2B2421" stroke-width="3.8"/>
    <circle cx="288.1" cy="133.75" r="36.1" fill="#2B2421" stroke="#2B2421" stroke-width="3.8"/>
