<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <defs>
    <radialGradient id="bubuBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E99" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="duduBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8E85" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartPinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FF5277"/>
    </linearGradient>
    <linearGradient id="heartRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#D92027"/>
    </linearGradient>
    <linearGradient id="bobaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D1A0"/>
      <stop offset="100%" stop-color="#C59B6D"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2F1FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#362213" flood-opacity="0.12"/>
    </filter>
  </defs>

<g filter="url(#softShadow)">

      
    <!-- Feet -->
    <ellipse cx="136.8" cy="404.5" rx="25.2" ry="18" fill="#FFFFFF" stroke="#2B2421" stroke-width="6.75"/>
    <ellipse cx="223.2" cy="404.5" rx="25.2" ry="18" fill="#FFFFFF" stroke="#2B2421" stroke-width="6.75"/>
    <!-- Chubby White Body -->
    <ellipse cx="180" cy="337" rx="94.5" ry="79.2" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.2"/>
  
      
    <!-- Bubu Ears -->
    <circle cx="91.8" cy="137.5" r="34.2" fill="#2B2421" stroke="#2B2421" stroke-width="3.6"/>
    <circle cx="268.2" cy="137.5" r="34.2" fill="#2B2421" stroke="#2B2421" stroke-width="3.6"/>
    <!-- Bubu Head Contour -->
    <path d="M 81 205
             C 63 155.5, 112.5 115, 180 115
             C 247.5 115, 297 155.5, 279 205
             C 297 254.5, 265.5 290.5, 180 290.5
             C 94.5 290.5, 63 254.5, 81 205 Z"
          fill="#FFFFFF" stroke="#2B2421" stroke-width="7.2" stroke-linejoin="round"/>
    <!-- Blushing Cheeks -->
    <ellipse cx="111.6" cy="227.5" rx="27" ry="16.2" fill="url(#bubuBlush)"/>
    <ellipse cx="248.4" cy="227.5" rx="27" ry="16.2" fill="url(#bubuBlush)"/>
  
      
    <!-- Left Happy Eye Curve -->
    <path d="M 115.2 197.8 Q 129.6 183.4 144 197.8"
          fill="none" stroke="#2B2421" stroke-width="6.75" stroke-linecap="round"/>
    <!-- Right Happy Eye Curve -->
    <path d="M 216 197.8 Q 230.4 183.4 244.8 197.8"
          fill="none" stroke="#2B2421" stroke-width="6.75" stroke-linecap="round"/>
    <!-- Nose & Sweet Smile -->
    <ellipse cx="180" cy="209.5" rx="5.4" ry="3.6" fill="#2B2421"/>
    <path d="M 170.1 216.7 C 174.6 223.9, 180 223.9, 180 216.7 C 180 223.9, 185.4 223.9, 189.9 216.7"
          fill="none" stroke="#2B2421" stroke-width="4.95" stroke-linecap="round"/>
  
      
    <!-- Feet -->
    <ellipse cx="288.8" cy="404.5" rx="25.2" ry="18" fill="#BA8358" stroke="#3E2723" stroke-width="6.75"/>
    <ellipse cx="375.2" cy="404.5" rx="25.2" ry="18" fill="#BA8358" stroke="#3E2723" stroke-width="6.75"/>
    <!-- Chubby Brown Body -->
    <ellipse cx="332" cy="337" rx="94.5" ry="79.2" fill="#BA8358" stroke="#3E2723" stroke-width="7.2"/>
    <!-- Light Cream Belly -->
    <ellipse cx="332" cy="342.4" rx="54" ry="45" fill="#F5E3D0"/>
  
      
    <!-- Dudu Ears -->
    <circle cx="243.8" cy="137.5" r="34.2" fill="#BA8358" stroke="#3E2723" stroke-width="6.75"/>
    <circle cx="243.8" cy="137.5" r="19.8" fill="#8C5935"/>
    <circle cx="420.2" cy="137.5" r="34.2" fill="#BA8358" stroke="#3E2723" stroke-width="6.75"/>
    <circle cx="420.2" cy="137.5" r="19.8" fill="#8C5935"/>
    <!-- Dudu Head Contour -->
    <path d="M 233 205
             C 215 155.5, 264.5 115, 332 115
             C 399.5 115, 449 155.5, 431 205
             C 449 254.5, 417.5 290.5, 332 290.5
             C 246.5 290.5, 215 254.5, 233 205 Z"
          fill="#BA8358" stroke="#3E2723" stroke-width="7.2" stroke-linejoin="round"/>
    <!-- Snout Muzzle -->
    <ellipse cx="332" cy="224.8" rx="45" ry="32.4" fill="#F5E3D0" stroke="#3E2723" stroke-width="4.5"/>
    <!-- Blushing Cheeks -->
    <ellipse cx="261.8" cy="224.8" rx="25.2" ry="14.4" fill="url(#duduBlush)"/>
    <ellipse cx="402.2" cy="224.8" rx="25.2" ry="14.4" fill="url(#duduBlush)"/>
  
      
    <!-- Left Happy Eye Curve -->
    <path d="M 267.2 194.2 Q 281.6 179.8 296 194.2"
          fill="none" stroke="#3E2723" stroke-width="6.75" stroke-linecap="round"/>
    <!-- Right Happy Eye Curve -->
    <path d="M 368 194.2 Q 382.4 179.8 396.8 194.2"
          fill="none" stroke="#3E2723" stroke-width="6.75" stroke-linecap="round"/>
    <!-- Nose & Open Mouth with Tongue -->
    <path d="M 322.1 213.1 Q 332 207.7 341.9 213.1 Q 332 223.9 322.1 213.1 Z"
          fill="#3E2723"/>
    <path d="M 321.2 228.4 Q 332 242.8 342.8 228.4 Z"
          fill="#FF758C" stroke="#3E2723" stroke-width="4.05"/>
  
      <!-- Slice of Pizza with Stretching Cheese -->
      <g transform="translate(256, 290)">
        <polygon points="-40,-10 0,45 40,-10" fill="#FFA502" stroke="#3E2723" stroke-width="6"/>
        <!-- Crust -->
        <path d="M -45 -10 Q 0 -22 45 -10" fill="none" stroke="#E5A65D" stroke-width="12" stroke-linecap="round"/>
        <!-- Pepperoni -->
        <circle cx="-12" cy="5" r="7" fill="#D92027"/>
        <circle cx="12" cy="8" r="6" fill="#D92027"/>
        <!-- Stretching Melted Cheese Strands to Mouths -->
        <path d="M -15 -10 Q -45 -40 -60 -45" fill="none" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
        <path d="M 15 -10 Q 45 -40 60 -45" fill="none" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
      </g>
      <!-- Paws Holding Pizza -->
      <ellipse cx="210" cy="305" rx="16" ry="14" fill="#FFFFFF" stroke="#2B2421" stroke-width="6"/>
      <ellipse cx="302" cy="305" rx="16" ry="14" fill="#BA8358" stroke="#3E2723" stroke-width="6"/>
    
</g>
</svg>