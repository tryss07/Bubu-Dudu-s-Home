<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <defs>
    <radialGradient id="bubuBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E99" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="duduBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8E85" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartPinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FF5277"/>
    </linearGradient>
    <linearGradient id="heartRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#D92027"/>
    </linearGradient>
    <linearGradient id="bobaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D1A0"/>
      <stop offset="100%" stop-color="#C59B6D"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2F1FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#362213" flood-opacity="0.12"/>
    </filter>
  </defs>

<g filter="url(#softShadow)">

      <!-- Bubu (Left) Looking up happily purring -->
      
    <!-- Feet with dark bottom curves -->
    <ellipse cx="146.8" cy="414.5" rx="25.2" ry="18" fill="#FFFFFF" stroke="#2B2421" stroke-width="6.75"/>
    <ellipse cx="233.2" cy="414.5" rx="25.2" ry="18" fill="#FFFFFF" stroke="#2B2421" stroke-width="6.75"/>
    <!-- Chubby Pure White Body -->
    <ellipse cx="190" cy="347" rx="94.5" ry="79.2" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.2"/>
  
      
    <!-- Bubu Ears (Solid Round Panda Ears) -->
    <circle cx="103.6" cy="157.5" r="34.2" fill="#2B2421" stroke="#2B2421" stroke-width="3.6"/>
    <circle cx="276.4" cy="157.5" r="34.2" fill="#2B2421" stroke="#2B2421" stroke-width="3.6"/>
    <!-- Bubu Head Contour (Chubby Cute Face) -->
    <path d="M 91 225
             C 73 175.5, 122.5 135, 190 135
             C 257.5 135, 307 175.5, 289 225
             C 307 274.5, 275.5 310.5, 190 310.5
             C 104.5 310.5, 73 274.5, 91 225 Z"
          fill="#FFFFFF" stroke="#2B2421" stroke-width="7.2" stroke-linejoin="round"/>
    <!-- Blushing Pink Cheeks -->
    <ellipse cx="121.6" cy="244.8" rx="25.2" ry="16.2" fill="#FFA8A3" opacity="0.85"/>
    <ellipse cx="258.4" cy="244.8" rx="25.2" ry="16.2" fill="#FFA8A3" opacity="0.85"/>
  
      
    <!-- Both Eyes Happy Curved Lines -->
    <path d="M 130.6 221.4 Q 143.2 208.8 155.8 221.4"
          fill="none" stroke="#2B2421" stroke-width="6.75" stroke-linecap="round"/>
    <path d="M 224.2 221.4 Q 236.8 208.8 249.4 221.4"
          fill="none" stroke="#2B2421" stroke-width="6.75" stroke-linecap="round"/>
    <!-- Sweet Smile -->
    <path d="M 175.6 235.8 Q 182.8 244.8 190 237.6 Q 197.2 244.8 204.4 235.8"
          fill="none" stroke="#2B2421" stroke-width="4.95" stroke-linecap="round"/>
    <!-- Bubu Neck Bowtie Ribbon -->
    <path d="M 190 307.8 L 168.4 298.8 L 172 318.6 Z M 190 307.8 L 211.6 298.8 L 208 318.6 Z" fill="#2B2421"/>
    <circle cx="190" cy="308.7" r="5.4" fill="#2B2421"/>
  
      <!-- Dudu (Right) Gently Patting Bubu -->
      
    <!-- Feet -->
    <ellipse cx="284.4" cy="409.75" rx="26.599999999999998" ry="19" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <ellipse cx="375.6" cy="409.75" rx="26.599999999999998" ry="19" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <!-- Solid Honey Brown Body (NO Cream Belly Patch!) -->
    <ellipse cx="330" cy="338.5" rx="99.75" ry="83.6" fill="#BA8358" stroke="#3E2723" stroke-width="7.6"/>
  
      
    <!-- Dudu Ears (Round with Darker Inner Circle) -->
    <circle cx="238.8" cy="133.75" r="36.1" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <circle cx="238.8" cy="133.75" r="19" fill="#4A2E1B"/>
    <circle cx="421.2" cy="133.75" r="36.1" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <circle cx="421.2" cy="133.75" r="19" fill="#4A2E1B"/>
    <!-- Dudu Head Contour (Solid Brown Fur, No Muzzle) -->
    <path d="M 225.5 205
             C 206.5 152.75, 258.75 110, 330 110
             C 401.25 110, 453.5 152.75, 434.5 205
             C 453.5 257.25, 420.25 295.25, 330 295.25
             C 239.75 295.25, 206.5 257.25, 225.5 205 Z"
          fill="#BA8358" stroke="#3E2723" stroke-width="7.6" stroke-linejoin="round"/>
    <!-- Warm Peach Blush Cheeks -->
    <ellipse cx="257.8" cy="225.9" rx="26.599999999999998" ry="17.099999999999998" fill="#F6A77E" opacity="0.85"/>
    <ellipse cx="402.2" cy="225.9" rx="26.599999999999998" ry="17.099999999999998" fill="#F6A77E" opacity="0.85"/>
  
      
    <!-- Happy Curved Eyes -->
    <path d="M 267.3 201.2 Q 280.6 187.9 293.9 201.2"
          fill="none" stroke="#3E2723" stroke-width="7.125" stroke-linecap="round"/>
    <path d="M 366.1 201.2 Q 379.4 187.9 392.7 201.2"
          fill="none" stroke="#3E2723" stroke-width="7.125" stroke-linecap="round"/>
    <!-- Open Mouth with Tongue -->
    <path d="M 318.6 220.2 Q 330 237.3 341.4 220.2 Z"
          fill="#FF758C" stroke="#3E2723" stroke-width="4.2749999999999995"/>
  
      <!-- Dudu Arm Extended to Bubu Head -->
      <path d="M 310 270 Q 250 180 195 155" fill="none" stroke="#3E2723" stroke-width="15" stroke-linecap="round"/>
      <path d="M 310 270 Q 250 180 195 155" fill="none" stroke="#BA8358" stroke-width="9" stroke-linecap="round"/>
      <!-- Dudu Paw on Bubu Head -->
      <ellipse cx="190" cy="150" rx="26" ry="18" fill="#BA8358" stroke="#3E2723" stroke-width="6.5"/>
      <!-- Soft Warmth Sparkles -->
      <g fill="#FF758C">
        <circle cx="160" cy="120" r="6"/>
        <circle cx="215" cy="115" r="8"/>
        <circle cx="140" cy="140" r="5"/>
      </g>
    
</g>
</svg>