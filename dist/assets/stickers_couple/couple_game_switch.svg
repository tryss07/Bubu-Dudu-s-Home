    <!-- Blushing Cheeks -->
    <ellipse cx="111.6" cy="227.5" rx="27" ry="16.2" fill="url(#bubuBlush)"/>
    <ellipse cx="248.4" cy="227.5" rx="27" ry="16.2" fill="url(#bubuBlush)"/>
  
      
    <!-- Left Eye Patch -->
    <ellipse cx="129.6" cy="196" rx="18.900000000000002" ry="22.5" fill="#2B2421" transform="rotate(-7 129.6 196)"/>
    <circle cx="126.9" cy="192.4" r="6.3" fill="#FFFFFF"/>
    <circle cx="134.1" cy="200.5" r="2.7" fill="#FFFFFF"/>
    <!-- Right Eye Patch -->
    <ellipse cx="230.4" cy="196" rx="18.900000000000002" ry="22.5" fill="#2B2421" transform="rotate(7 230.4 196)"/>
    <circle cx="227.7" cy="192.4" r="6.3" fill="#FFFFFF"/>
    <circle cx="234.9" cy="200.5" r="2.7" fill="#FFFFFF"/>
    <!-- Nose & Cat Mouth -->
    <ellipse cx="180" cy="209.5" rx="5.4" ry="3.6" fill="#2B2421"/>
    <path d="M 170.1 216.7 C 174.6 223, 180 223, 180 216.7 C 180 223, 185.4 223, 189.9 216.7"
          fill="none" stroke="#2B2421" stroke-width="4.95" stroke-linecap="round"/>
  
      
    <!-- Feet -->
    <ellipse cx="288.8" cy="404.5" rx="25.2" ry="18" fill="#BA8358" stroke="#3E2723" stroke-width="6.75"/>
    <ellipse cx="375.2" cy="404.5" rx="25.2" ry="18" fill="#BA8358" stroke="#3E2723" stroke-width="6.75"/>
    <!-- Chubby Brown Body -->
    <ellipse cx="332" cy="337" rx="94.5" ry="79.2" fill="#BA8358" stroke="#3E2723" stroke-width="7.2"/>
    <!-- Light Cream Belly -->
    <ellipse cx="332" cy="342.4" rx="54" ry="45" fill="#F5E3D0"/>
  
      
    <!-- Dudu Ears -->
    <circle cx="243.8" cy="137.5" r="34.2" fill="#BA8358" stroke="#3E2723" stroke-width="6.75"/>
    <circle cx="243.8" cy="137.5" r="19.8" fill="#8C5935"/>
    <circle cx="420.2" cy="137.5" r="34.2" fill="#BA8358" stroke="#3E2723" stroke-width="6.75"/>
    <circle cx="420.2" cy="137.5" r="19.8" fill="#8C5935"/>
    <!-- Dudu Head Contour -->
    <path d="M 233 205
             C 215 155.5, 264.5 115, 332 115
             C 399.5 115, 449 155.5, 431 205
             C 449 254.5, 417.5 290.5, 332 290.5
             C 246.5 290.5, 215 254.5, 233 205 Z"
          fill="#BA8358" stroke="#3E2723" stroke-width="7.2" stroke-linejoin="round"/>
    <!-- Snout Muzzle -->
    <ellipse cx="332" cy="224.8" rx="45" ry="32.4" fill="#F5E3D0" stroke="#3E2723" stroke-width="4.5"/>
    <!-- Blushing Cheeks -->
    <ellipse cx="261.8" cy="224.8" rx="25.2" ry="14.4" fill="url(#duduBlush)"/>
    <ellipse cx="402.2" cy="224.8" rx="25.2" ry="14.4" fill="url(#duduBlush)"/>
  
      
    <!-- Left Eye -->
    <circle cx="279.8" cy="192.4" r="12.6" fill="#3E2723"/>
    <circle cx="277.1" cy="188.8" r="4.5" fill="#FFFFFF"/>
    <circle cx="283.4" cy="195.1" r="2.25" fill="#FFFFFF"/>
    <!-- Right Eye -->
    <circle cx="384.2" cy="192.4" r="12.6" fill="#3E2723"/>
    <circle cx="381.5" cy="188.8" r="4.5" fill="#FFFFFF"/>
    <circle cx="387.8" cy="195.1" r="2.25" fill="#FFFFFF"/>
    <!-- Nose & Mouth on Snout -->
    <path d="M 322.1 213.1 Q 332 207.7 341.9 213.1 Q 332 223.9 322.1 213.1 Z"
          fill="#3E2723"/>
    <path d="M 322.1 228.4 C 326.6 234.7, 332 234.7, 332 228.4 C 332 234.7, 337.4 234.7, 341.9 228.4"
          fill="none" stroke="#3E2723" stroke-width="4.5" stroke-linecap="round"/>
  
      <!-- Bubu Blue Joycon -->
      <g transform="translate(200, 290) rotate(15)">
        <rect x="-14" y="-28" width="28" height="56" rx="12" fill="#54A0FF" stroke="#2B2421" stroke-width="5"/>
        <circle cx="0" cy="-12" r="6" fill="#2B2421"/>
        <circle cx="0" cy="10" r="4" fill="#2B2421"/>
      </g>
      <!-- Dudu Red Joycon -->
      <g transform="translate(312, 290) rotate(-15)">
        <rect x="-14" y="-28" width="28" height="56" rx="12" fill="#FF4757" stroke="#3E2723" stroke-width="5"/>
        <circle cx="0" cy="-12" r="6" fill="#2B2421"/>
        <circle cx="0" cy="10" r="4" fill="#2B2421"/>
      </g>
      <!-- Victory Sparkles -->
      <polygon points="256,120 260,132 272,135 260,138 256,150 252,138 240,135 252,132" fill="#FFD166"/>
    
</g>
</svg>