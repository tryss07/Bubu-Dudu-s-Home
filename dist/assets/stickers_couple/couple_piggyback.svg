    <ellipse cx="334" cy="272" rx="28" ry="16" fill="url(#duduBlush)"/>
  
      
    <!-- Left Happy Eye Curve -->
    <path d="M 184 238 Q 200 222 216 238"
          fill="none" stroke="#3E2723" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Right Happy Eye Curve -->
    <path d="M 296 238 Q 312 222 328 238"
