<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <defs>
    <radialGradient id="bubuBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E99" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="duduBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8E85" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartPinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FF5277"/>
    </linearGradient>
    <linearGradient id="heartRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#D92027"/>
    </linearGradient>
    <linearGradient id="bobaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D1A0"/>
      <stop offset="100%" stop-color="#C59B6D"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2F1FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#362213" flood-opacity="0.12"/>
    </filter>
  </defs>

<g filter="url(#softShadow)">

      <!-- Dudu Carrying (Bottom) -->
      
    <!-- Feet -->
    <ellipse cx="205.6" cy="450.25" rx="29.400000000000002" ry="21" fill="#BA8358" stroke="#3E2723" stroke-width="7.875"/>
    <ellipse cx="306.4" cy="450.25" rx="29.400000000000002" ry="21" fill="#BA8358" stroke="#3E2723" stroke-width="7.875"/>
    <!-- Solid Honey Brown Body (NO Cream Belly Patch!) -->
    <ellipse cx="256" cy="371.5" rx="110.25" ry="92.4" fill="#BA8358" stroke="#3E2723" stroke-width="8.4"/>
  
      
    <!-- Dudu Ears (Round with Darker Inner Circle) -->
    <circle cx="160" cy="175" r="38" fill="#BA8358" stroke="#3E2723" stroke-width="7.5"/>
    <circle cx="160" cy="175" r="20" fill="#4A2E1B"/>
    <circle cx="352" cy="175" r="38" fill="#BA8358" stroke="#3E2723" stroke-width="7.5"/>
    <circle cx="352" cy="175" r="20" fill="#4A2E1B"/>
    <!-- Dudu Head Contour (Solid Brown Fur, No Muzzle) -->
    <path d="M 146 250
             C 126 195, 181 150, 256 150
             C 331 150, 386 195, 366 250
             C 386 305, 351 345, 256 345
             C 161 345, 126 305, 146 250 Z"
          fill="#BA8358" stroke="#3E2723" stroke-width="8" stroke-linejoin="round"/>
    <!-- Warm Peach Blush Cheeks -->
    <ellipse cx="180" cy="272" rx="28" ry="18" fill="#F6A77E" opacity="0.85"/>
    <ellipse cx="332" cy="272" rx="28" ry="18" fill="#F6A77E" opacity="0.85"/>
  
      
    <!-- Happy Curved Eyes -->
    <path d="M 190 246 Q 204 232 218 246"
          fill="none" stroke="#3E2723" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M 294 246 Q 308 232 322 246"
          fill="none" stroke="#3E2723" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Open Mouth with Tongue -->
    <path d="M 244 266 Q 256 284 268 266 Z"
          fill="#FF758C" stroke="#3E2723" stroke-width="4.5"/>
  
      <!-- Bubu on Dudu Shoulders (Top) -->
      <g transform="translate(0, -110)">
        
    <!-- Bubu Ears (Solid Round Panda Ears) -->
    <circle cx="169.6" cy="132.5" r="34.2" fill="#2B2421" stroke="#2B2421" stroke-width="3.6"/>
    <circle cx="342.4" cy="132.5" r="34.2" fill="#2B2421" stroke="#2B2421" stroke-width="3.6"/>
    <!-- Bubu Head Contour (Chubby Cute Face) -->
    <path d="M 157 200
             C 139 150.5, 188.5 110, 256 110
             C 323.5 110, 373 150.5, 355 200
             C 373 249.5, 341.5 285.5, 256 285.5
             C 170.5 285.5, 139 249.5, 157 200 Z"
          fill="#FFFFFF" stroke="#2B2421" stroke-width="7.2" stroke-linejoin="round"/>
    <!-- Blushing Pink Cheeks -->
    <ellipse cx="187.6" cy="219.8" rx="25.2" ry="16.2" fill="#FFA8A3" opacity="0.85"/>
    <ellipse cx="324.4" cy="219.8" rx="25.2" ry="16.2" fill="#FFA8A3" opacity="0.85"/>
  
        
    <!-- Both Eyes Happy Curved Lines -->
    <path d="M 196.6 196.4 Q 209.2 183.8 221.8 196.4"
          fill="none" stroke="#2B2421" stroke-width="6.75" stroke-linecap="round"/>
    <path d="M 290.2 196.4 Q 302.8 183.8 315.4 196.4"
          fill="none" stroke="#2B2421" stroke-width="6.75" stroke-linecap="round"/>
    <!-- Sweet Smile -->
    <path d="M 241.6 210.8 Q 248.8 219.8 256 212.6 Q 263.2 219.8 270.4 210.8"
          fill="none" stroke="#2B2421" stroke-width="4.95" stroke-linecap="round"/>
    <!-- Bubu Neck Bowtie Ribbon -->
    <path d="M 256 282.8 L 234.4 273.8 L 238 293.6 Z M 256 282.8 L 277.6 273.8 L 274 293.6 Z" fill="#2B2421"/>
    <circle cx="256" cy="283.7" r="5.4" fill="#2B2421"/>
  
        <!-- Bubu Arms Raised Cheering -->
        <ellipse cx="160" cy="180" rx="18" ry="14" fill="#FFFFFF" stroke="#2B2421" stroke-width="6.5"/>
        <ellipse cx="352" cy="180" rx="18" ry="14" fill="#FFFFFF" stroke="#2B2421" stroke-width="6.5"/>
      </g>
      <!-- Dudu Hands Holding Bubu Legs -->
      <ellipse cx="170" cy="310" rx="20" ry="16" fill="#BA8358" stroke="#3E2723" stroke-width="7"/>
      <ellipse cx="342" cy="310" rx="20" ry="16" fill="#BA8358" stroke="#3E2723" stroke-width="7"/>
    
</g>
</svg>