    <!-- Light Cream Belly -->
    <ellipse cx="256" cy="377.8" rx="63" ry="52.5" fill="#F5E3D0"/>
  
      
    <!-- Dudu Ears -->
    <circle cx="158" cy="175" r="38" fill="#BA8358" stroke="#3E2723" stroke-width="7.5"/>
    <circle cx="158" cy="175" r="22" fill="#8C5935"/>
    <circle cx="354" cy="175" r="38" fill="#BA8358" stroke="#3E2723" stroke-width="7.5"/>
