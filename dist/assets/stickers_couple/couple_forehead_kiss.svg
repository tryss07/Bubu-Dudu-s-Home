<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <defs>
    <radialGradient id="bubuBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E99" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="duduBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8E85" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartPinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FF5277"/>
    </linearGradient>
    <linearGradient id="heartRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#D92027"/>
    </linearGradient>
    <linearGradient id="bobaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D1A0"/>
      <stop offset="100%" stop-color="#C59B6D"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2F1FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#362213" flood-opacity="0.12"/>
    </filter>
  </defs>

<g filter="url(#softShadow)">

      <!-- Bubu (Left) with closed bliss eyes and blushing -->
      
    <!-- Feet with dark bottom curves -->
    <ellipse cx="144.4" cy="409.75" rx="26.599999999999998" ry="19" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.125"/>
    <ellipse cx="235.6" cy="409.75" rx="26.599999999999998" ry="19" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.125"/>
    <!-- Chubby Pure White Body -->
    <ellipse cx="190" cy="338.5" rx="99.75" ry="83.6" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.6"/>
  
      
    <!-- Bubu Ears (Solid Round Panda Ears) -->
    <circle cx="98.80000000000001" cy="143.75" r="36.1" fill="#2B2421" stroke="#2B2421" stroke-width="3.8"/>
    <circle cx="281.2" cy="143.75" r="36.1" fill="#2B2421" stroke="#2B2421" stroke-width="3.8"/>
    <!-- Bubu Head Contour (Chubby Cute Face) -->
    <path d="M 85.5 215
             C 66.5 162.75, 118.75 120, 190 120
             C 261.25 120, 313.5 162.75, 294.5 215
             C 313.5 267.25, 280.25 305.25, 190 305.25
             C 99.75 305.25, 66.5 267.25, 85.5 215 Z"
          fill="#FFFFFF" stroke="#2B2421" stroke-width="7.6" stroke-linejoin="round"/>
    <!-- Blushing Pink Cheeks -->
    <ellipse cx="117.8" cy="235.9" rx="26.599999999999998" ry="17.099999999999998" fill="#FFA8A3" opacity="0.85"/>
    <ellipse cx="262.2" cy="235.9" rx="26.599999999999998" ry="17.099999999999998" fill="#FFA8A3" opacity="0.85"/>
  
      
    <!-- Both Eyes Happy Curved Lines -->
    <path d="M 127.30000000000001 211.2 Q 140.6 197.9 153.9 211.2"
          fill="none" stroke="#2B2421" stroke-width="7.125" stroke-linecap="round"/>
    <path d="M 226.1 211.2 Q 239.4 197.9 252.7 211.2"
          fill="none" stroke="#2B2421" stroke-width="7.125" stroke-linecap="round"/>
    <!-- Sweet Smile -->
    <path d="M 174.8 226.4 Q 182.4 235.9 190 228.3 Q 197.6 235.9 205.2 226.4"
          fill="none" stroke="#2B2421" stroke-width="5.225" stroke-linecap="round"/>
    <!-- Bubu Neck Bowtie Ribbon -->
    <path d="M 190 302.4 L 167.2 292.9 L 171 313.8 Z M 190 302.4 L 212.8 292.9 L 209 313.8 Z" fill="#2B2421"/>
    <circle cx="190" cy="303.35" r="5.699999999999999" fill="#2B2421"/>
  
      <!-- Dudu (Right) Leaning in kissing forehead -->
      <g transform="translate(45, -10) rotate(-15 320 220)">
        
    <!-- Feet -->
    <ellipse cx="254.4" cy="409.75" rx="26.599999999999998" ry="19" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <ellipse cx="345.6" cy="409.75" rx="26.599999999999998" ry="19" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <!-- Solid Honey Brown Body (NO Cream Belly Patch!) -->
    <ellipse cx="300" cy="338.5" rx="99.75" ry="83.6" fill="#BA8358" stroke="#3E2723" stroke-width="7.6"/>
  
        
    <!-- Dudu Ears (Round with Darker Inner Circle) -->
    <circle cx="208.8" cy="133.75" r="36.1" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <circle cx="208.8" cy="133.75" r="19" fill="#4A2E1B"/>
    <circle cx="391.2" cy="133.75" r="36.1" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <circle cx="391.2" cy="133.75" r="19" fill="#4A2E1B"/>
    <!-- Dudu Head Contour (Solid Brown Fur, No Muzzle) -->
    <path d="M 195.5 205
             C 176.5 152.75, 228.75 110, 300 110
             C 371.25 110, 423.5 152.75, 404.5 205
             C 423.5 257.25, 390.25 295.25, 300 295.25
             C 209.75 295.25, 176.5 257.25, 195.5 205 Z"
          fill="#BA8358" stroke="#3E2723" stroke-width="7.6" stroke-linejoin="round"/>
    <!-- Warm Peach Blush Cheeks -->
    <ellipse cx="227.8" cy="225.9" rx="26.599999999999998" ry="17.099999999999998" fill="#F6A77E" opacity="0.85"/>
    <ellipse cx="372.2" cy="225.9" rx="26.599999999999998" ry="17.099999999999998" fill="#F6A77E" opacity="0.85"/>
  
        
    <!-- Happy Curved Eyes -->
    <path d="M 237.3 201.2 Q 250.6 187.9 263.9 201.2"
          fill="none" stroke="#3E2723" stroke-width="7.125" stroke-linecap="round"/>
    <path d="M 336.1 201.2 Q 349.4 187.9 362.7 201.2"
          fill="none" stroke="#3E2723" stroke-width="7.125" stroke-linecap="round"/>
    <!-- Open Mouth with Tongue -->
    <path d="M 288.6 220.2 Q 300 237.3 311.4 220.2 Z"
          fill="#FF758C" stroke="#3E2723" stroke-width="4.2749999999999995"/>
  
      </g>
      <!-- Tender Loving Hearts -->
      <g transform="translate(230, 110)">
        <path d="M 20 20 C 20 5, 0 -5, 0 10 C 0 25, 20 40, 20 45 C 20 40, 40 25, 40 10 C 40 -5, 20 5, 20 20 Z" fill="#FF5277" stroke="#2B2421" stroke-width="4.5"/>
      </g>
    
</g>
</svg>