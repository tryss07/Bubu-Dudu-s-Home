<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <defs>
    <radialGradient id="bubuBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E99" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="duduBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8E85" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFA8A3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFA8A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartPinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FF5277"/>
    </linearGradient>
    <linearGradient id="heartRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#D92027"/>
    </linearGradient>
    <linearGradient id="bobaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D1A0"/>
      <stop offset="100%" stop-color="#C59B6D"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2F1FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#362213" flood-opacity="0.12"/>
    </filter>
  </defs>

<g filter="url(#softShadow)">

      <!-- Bubu (Left) Walking -->
      
    <!-- Feet -->
    <ellipse cx="144.4" cy="409.75" rx="26.599999999999998" ry="19" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.125"/>
    <ellipse cx="235.6" cy="409.75" rx="26.599999999999998" ry="19" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.125"/>
    <!-- Chubby White Body -->
    <ellipse cx="190" cy="338.5" rx="99.75" ry="83.6" fill="#FFFFFF" stroke="#2B2421" stroke-width="7.6"/>
  
      
    <!-- Bubu Ears -->
    <circle cx="96.9" cy="133.75" r="36.1" fill="#2B2421" stroke="#2B2421" stroke-width="3.8"/>
    <circle cx="283.1" cy="133.75" r="36.1" fill="#2B2421" stroke="#2B2421" stroke-width="3.8"/>
    <!-- Bubu Head Contour -->
    <path d="M 85.5 205
             C 66.5 152.75, 118.75 110, 190 110
             C 261.25 110, 313.5 152.75, 294.5 205
             C 313.5 257.25, 280.25 295.25, 190 295.25
             C 99.75 295.25, 66.5 257.25, 85.5 205 Z"
          fill="#FFFFFF" stroke="#2B2421" stroke-width="7.6" stroke-linejoin="round"/>
    <!-- Blushing Cheeks -->
    <ellipse cx="117.8" cy="228.75" rx="28.5" ry="17.099999999999998" fill="url(#bubuBlush)"/>
    <ellipse cx="262.2" cy="228.75" rx="28.5" ry="17.099999999999998" fill="url(#bubuBlush)"/>
  
      
    <!-- Left Happy Eye Curve -->
    <path d="M 121.60000000000001 197.4 Q 136.8 182.2 152 197.4"
          fill="none" stroke="#2B2421" stroke-width="7.125" stroke-linecap="round"/>
    <!-- Right Happy Eye Curve -->
    <path d="M 228 197.4 Q 243.2 182.2 258.4 197.4"
          fill="none" stroke="#2B2421" stroke-width="7.125" stroke-linecap="round"/>
    <!-- Nose & Sweet Smile -->
    <ellipse cx="190" cy="209.75" rx="5.699999999999999" ry="3.8" fill="#2B2421"/>
    <path d="M 179.55 217.35 C 184.3 224.95, 190 224.95, 190 217.35 C 190 224.95, 195.7 224.95, 200.45 217.35"
          fill="none" stroke="#2B2421" stroke-width="5.225" stroke-linecap="round"/>
  
      <!-- Dudu (Right) Walking -->
      
    <!-- Feet -->
    <ellipse cx="276.4" cy="409.75" rx="26.599999999999998" ry="19" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <ellipse cx="367.6" cy="409.75" rx="26.599999999999998" ry="19" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <!-- Chubby Brown Body -->
    <ellipse cx="322" cy="338.5" rx="99.75" ry="83.6" fill="#BA8358" stroke="#3E2723" stroke-width="7.6"/>
    <!-- Light Cream Belly -->
    <ellipse cx="322" cy="344.2" rx="57" ry="47.5" fill="#F5E3D0"/>
  
      
    <!-- Dudu Ears -->
    <circle cx="228.9" cy="133.75" r="36.1" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <circle cx="228.9" cy="133.75" r="20.9" fill="#8C5935"/>
    <circle cx="415.1" cy="133.75" r="36.1" fill="#BA8358" stroke="#3E2723" stroke-width="7.125"/>
    <circle cx="415.1" cy="133.75" r="20.9" fill="#8C5935"/>
    <!-- Dudu Head Contour -->
    <path d="M 217.5 205
             C 198.5 152.75, 250.75 110, 322 110
             C 393.25 110, 445.5 152.75, 426.5 205
             C 445.5 257.25, 412.25 295.25, 322 295.25
             C 231.75 295.25, 198.5 257.25, 217.5 205 Z"
          fill="#BA8358" stroke="#3E2723" stroke-width="7.6" stroke-linejoin="round"/>
    <!-- Snout Muzzle -->
    <ellipse cx="322" cy="225.9" rx="47.5" ry="34.199999999999996" fill="#F5E3D0" stroke="#3E2723" stroke-width="4.75"/>
    <!-- Blushing Cheeks -->
    <ellipse cx="247.9" cy="225.9" rx="26.599999999999998" ry="15.2" fill="url(#duduBlush)"/>
    <ellipse cx="396.1" cy="225.9" rx="26.599999999999998" ry="15.2" fill="url(#duduBlush)"/>
  
      
    <!-- Left Happy Eye Curve -->
    <path d="M 253.60000000000002 193.6 Q 268.8 178.4 284 193.6"
          fill="none" stroke="#3E2723" stroke-width="7.125" stroke-linecap="round"/>
    <!-- Right Happy Eye Curve -->
    <path d="M 360 193.6 Q 375.2 178.4 390.4 193.6"
          fill="none" stroke="#3E2723" stroke-width="7.125" stroke-linecap="round"/>
    <!-- Nose & Open Mouth with Tongue -->
    <path d="M 311.55 213.55 Q 322 207.85 332.45 213.55 Q 322 224.95 311.55 213.55 Z"
          fill="#3E2723"/>
    <path d="M 310.6 229.7 Q 322 244.9 333.4 229.7 Z"
          fill="#FF758C" stroke="#3E2723" stroke-width="4.2749999999999995"/>
  
      <!-- Paws Interlocked Holding Hands in Center -->
      <g transform="translate(256, 315)">
        <ellipse cx="-12" cy="0" rx="18" ry="14" fill="#FFFFFF" stroke="#2B2421" stroke-width="6.5"/>
        <ellipse cx="12" cy="0" rx="18" ry="14" fill="#BA8358" stroke="#3E2723" stroke-width="6.5"/>
      </g>
      <!-- Floating Hearts -->
      <path d="M 256 120 C 256 100, 230 90, 230 110 C 230 130, 256 150, 256 155 C 256 150, 282 130, 282 110 C 282 90, 256 100, 256 120 Z" fill="#FF5277" stroke="#2B2421" stroke-width="5"/>
    
</g>
</svg>