      <ellipse cx="195" cy="188" rx="8" ry="6" fill="#70A6FF"/>
      <circle cx="193" cy="186" r="3" fill="#FFFFFF"/>
      <circle cx="314" cy="192" r="15" fill="#3E2723"/>
